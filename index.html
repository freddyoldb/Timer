<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>⏱️ Timer</div>
    
    <div class="timer-display" id="timer">12:00:00</div>
    
    <div class="info-text">
        E-Mail wird gesendet am: <span id="target-date">--.--.---- um --:-- Uhr</span>
    </div>

    <div class="user-message-box">
        📌 Hinweis / Nachricht: <br>
        <span id="user-message">Hoffe du brichst dir auch mal ein Bein</span>
    </div>

    <script src="timer.js"></script>
</body>
</html>
